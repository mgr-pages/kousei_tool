<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朱書き照合ツール</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #fff; --ink: #1d2330; --sub: #5b6475; --line: #dde1e8; --accent: #0b6bcb; --accent-ink: #fff;
  --c-A: #1f8f4e; --c-B: #d1343b; --c-B2: #e48a8e; --c-C1: #8a8600; --c-C: #d9730d; --c-D: #9b3fa0; --c-E: #1c7ed6; --c-F: #6b7280; --c-M: #1f8f4e;
  --c-T: #d9730d; --c-K: #1f8f4e; --c-W: #c2185b; --c-V: #5b7cba; --c-I: #8a8f99; --c-J: #0f7b8a;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif; font-size: 14px; line-height: 1.6 }
button, input, select { font: inherit }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
header h1 { font-size: 18px; margin: 0 }
main { max-width: 1500px; margin: 0 auto; padding: 16px 20px 60px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px }
.card h2 { font-size: 15px; margin: 0 0 12px }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px }
.step { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px }
.step .t { font-weight: 700; font-size: 13px; margin-bottom: 6px }
.step .t span { display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; margin-right: 6px }
.step.over { border-color: var(--accent); background: #f0f6fd }
.pick { position: relative; display: inline-block; margin-bottom: 6px }
.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer }
.pick:focus-within { outline: 2px solid var(--accent); outline-offset: 1px }
.flist { list-style: none; margin: 0; padding: 0; counter-reset: f }
.flist li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #eef0f3; counter-increment: f }
.flist li::before { content: counter(f) "."; color: var(--sub); min-width: 18px }
.flist .nm { flex: 1; min-width: 0; word-break: break-all }
.flist .pc { color: var(--sub); white-space: nowrap }
.flist .ops button { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 0 5px; font-size: 11px; cursor: pointer; line-height: 18px }
.flist .ops button:disabled { opacity: .3; cursor: default }
.flist .em { flex-basis: 100%; color: var(--c-B); padding-left: 22px }
.flist li.err .nm { color: var(--c-B) }
.ftot { font-size: 12px; color: var(--sub); margin-top: 4px; display: flex; gap: 8px; align-items: center }
.ftot button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px }
.hint { color: var(--sub); font-size: 12px }
#mapNote { margin: -6px 0 10px }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer }
.btn:hover { border-color: #b9c1cf }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; padding: 8px 18px }
.btn.primary:disabled { opacity: .5; cursor: not-allowed }
.btn.small { padding: 2px 8px; font-size: 12px }
.runbar { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap }
.progress { flex: 1; min-width: 200px }
.progress .bar { height: 8px; background: #e8ebf0; border-radius: 99px; overflow: hidden }
.progress .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s }
.progress .msg { font-size: 12px; color: var(--sub); margin-top: 4px }
.err { color: var(--c-B); font-size: 13px; white-space: pre-wrap }
.summary { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px }
@media (max-width: 1000px) { .summary { grid-template-columns: 1fr } }
.sumgrp { border-radius: 10px; padding: 10px; background: #f6f7f9 }
.sumgrp.need { background: #fff3f3 }
.sumhd { font-size: 13px; font-weight: 700; margin-bottom: 8px }
.sumgrp.need .sumhd b { color: var(--c-B); font-size: 18px }
.sumcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px }
.sum { border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: #fff }
.sum.zero { opacity: .55 }
.sum.off { opacity: .35 }
.sum .n { font-size: 22px; font-weight: 700 }
.sum .l { font-size: 12px; color: var(--sub) }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 }
.toolbar .sp { flex: 1 }
.work { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(420px, 1.25fr); gap: 16px; align-items: start }
@media (max-width: 1000px) { .work { grid-template-columns: 1fr } .viewer { position: static !important } }
.work > * { min-width: 0 }
.list { display: flex; flex-direction: column; gap: 10px }
.item { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; padding: 10px 12px; cursor: pointer }
.item.sel { outline: 2px solid var(--accent); outline-offset: 1px }
.item .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.item.light { border-left-style: dashed }
.tag { font-size: 13px; font-weight: 700; color: #fff; background: var(--c); border-radius: 4px; padding: 1px 8px }
.todo { font-size: 13px; font-weight: 700 }
.pg { font-size: 12px; color: var(--sub); margin-left: auto }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin-top: 8px; font-size: 16px; line-height: 1.7; align-items: baseline }
.rows .lb { font-size: 11px; color: var(--sub); white-space: nowrap }
.rows .tx { word-break: break-all }
.rows .tx.ng { color: var(--c-B); font-weight: 700 } .rows .tx.okc { color: var(--c-A); font-weight: 700 }
del { background: #fde2e2; color: #a3151b; text-decoration: none; font-weight: 700; padding: 0 2px; border-radius: 3px }
ins { background: #d9f3e2; color: #0b5d2b; text-decoration: none; font-weight: 700; padding: 0 2px; border-radius: 3px }
.mk { color: var(--c-B); font-weight: 700; font-size: 13px }
.gap { display: inline-block; width: 3px; height: 1.1em; background: var(--c-B); vertical-align: -3px; margin: 0 3px; border-radius: 2px }
.more { color: var(--sub); font-size: 12px }
.what { margin-top: 8px; font-size: 15px }
.what.ng { color: var(--c-B); font-weight: 700; font-size: 13px; margin-top: 2px }
mark { background: #fde2e2; color: #a3151b; font-weight: 700; padding: 0 2px; border-radius: 3px }
.show { font-weight: 700; word-break: break-all }
.meta { font-size: 12px; color: var(--sub); margin-top: 2px }
.meta .ng { color: var(--c-B); font-weight: 700 }
.meta .okc { color: var(--c-A); font-weight: 700 }
.crops { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px }
.crops figure { margin: 0 }
.crops canvas { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #fff }
.crops figcaption { font-size: 11px; color: var(--sub) }
.crops figure.note { grid-column: 1 / -1 } .crops figure.note canvas { max-height: 120px; object-fit: contain }
.judge { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap }
.judge button.on[data-v="ok"] { background: #e3f4ea; border-color: var(--c-A); color: #0f5132; font-weight: 700 }
.judge button.on[data-v="fix"] { background: #fde8e8; border-color: var(--c-B); color: #8a1c21; font-weight: 700 }
.judge button.on[data-v="hold"] { background: #fff4e0; border-color: var(--c-C); color: #7a4300; font-weight: 700 }
.judge input { flex: 1; min-width: 120px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px }
.viewer { position: sticky; top: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px }
.viewer .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center }
.viewer .tabs .btn.on { background: var(--accent); color: #fff; border-color: var(--accent) }
.viewer .cap { display: grid; grid-template-columns: 1fr 1fr; font-size: 12px; color: var(--sub); text-align: center }
.viewer .scroll { max-height: calc(100vh - 120px); overflow: auto; border-radius: 6px; background: #e9ecf1 }
.viewer canvas { display: block; cursor: crosshair }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--sub); margin-top: 6px }
.legend i { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--c); margin-right: 3px; vertical-align: -1px }
.empty { color: var(--sub); text-align: center; padding: 30px }
.hidden { display: none !important }
@media print {
  #setup, .toolbar, .viewer, .judge input:placeholder-shown, .judge button:not(.on) { display: none !important }
  body { background: #fff } main { padding: 0 } .work { display: block } .item { break-inside: avoid; border-left-width: 4px; margin-bottom: 4mm }
  .summary { grid-template-columns: repeat(4, 1fr) } .crops canvas { max-height: 38mm; object-fit: contain } .item, .card { border-color: #bbb }
}
</style>
</head>
<body>
<header>
  <h1>朱書き照合ツール</h1>
</header>
<main>
  <section class="card" id="setup">
    <div class="steps">
      <div class="step" data-kind="marks"><div class="t"><span>1</span>原稿</div>
        <div class="hint">PDF（朱書き・ラフ）・画像・Excel・Word・PowerPoint・テキスト・CSV</div>
        <label class="btn small pick">＋ ファイルを追加<input type="file" id="fMarks" accept=".pdf,application/pdf,image/*,.xlsx,.xlsm,.docx,.docm,.pptx,.pptm,.txt,.csv,.tsv,.xls,.doc,.ppt" multiple></label>
        <ol class="flist" id="lMarks"></ol><div class="ftot" id="tMarks"></div></div>
      <div class="step" data-kind="nw"><div class="t"><span>2</span>成果物（PDF）</div>
        <label class="btn small pick">＋ ファイルを追加<input type="file" id="fNew" accept=".pdf,application/pdf" multiple></label>
        <ol class="flist" id="lNew"></ol><div class="ftot" id="tNew"></div></div>
      <div class="step" data-kind="old"><div class="t"><span>3</span>旧版（任意・PDF）</div>
        <div class="hint">前回の成果物。入れると、前回からの変化が指示どおりかも確かめます</div>
        <label class="btn small pick">＋ ファイルを追加<input type="file" id="fOld" accept=".pdf,application/pdf" multiple></label>
        <ol class="flist" id="lOld"></ol><div class="ftot" id="tOld"></div></div>
    </div>
    <div class="runbar">
      <button class="btn primary" id="run" disabled>照合</button>
      <div class="progress"><div class="bar"><div id="pbar"></div></div><div class="msg" id="pmsg"></div></div>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section id="results" class="hidden">
    <div class="card"><h2>結果の概要 <span class="hint" id="sumNote"></span></h2><div class="hint" id="mapNote"></div><div class="summary" id="summary"></div></div>
    <div class="toolbar">
      <label><input type="checkbox" id="hideDone"> 確認済み（OK）を隠す</label>
      <label><input type="checkbox" id="showMinor"> 参考も表示</label>
      <span class="sp"></span>
      <button class="btn" id="csv">CSVで保存</button>
      <button class="btn" id="print">印刷・PDFで保存</button>
    </div>
    <div class="work">
      <div class="list" id="list"></div>
      <div class="viewer" id="viewer">
        <div class="tabs" id="tabs"></div>
        <div class="hint" id="pinfo"></div>
        <div class="cap"><div>原稿</div><div>成果物</div></div>
        <div class="scroll" id="vscroll"><canvas id="vcanvas"></canvas></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </section>
</main>
<!--ASSETS-->
</body>
</html>
